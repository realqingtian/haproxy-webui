# keepalived 验证环境的 haproxy 配置(内容与 local-e2e 同款:演示前端 + stats)
global
    log stdout format raw local0 info
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# dataplaneapi 的 API Basic Auth 凭据(WebUI 注册实例时填同一组)
userlist dataplaneapi
    user dataplaneapi insecure-password demosecret

# 演示前端:把 VIP 标进响应头,方便验证主备切换后流量走的是当前 MASTER
frontend demo_http
    bind *:8888
    default_backend demo_app

backend demo_app
    balance roundrobin
    server s1 10.255.255.1:80 check inter 5s
    server s2 10.255.255.2:80 check inter 5s

listen stats
    bind *:8404
    stats enable
    stats uri /stats
