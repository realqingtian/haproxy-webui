# 前端 nginx 托管静态文件并把 /api 反代到同命名空间的 backend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: haproxy-webui
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: haproxy-webui-frontend:dev
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# NodePort 30080:kind extraPortMappings 已映射到宿主机 30080
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: haproxy-webui
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
