# 本地开发 IdP:供 OIDC 登录联调使用(非生产配置)
# 用户:admin@example.com / idp-password
issuer: http://localhost:5558/dex

web:
  http: 0.0.0.0:5558

storage:
  type: memory

staticClients:
  - id: haproxy-webui
    redirectURIs:
      - http://localhost:5173/api/auth/oidc/callback
      - http://localhost:8081/api/auth/oidc/callback
      - http://localhost:8080/api/auth/oidc/callback
    name: HAProxy WebUI
    secret: webui-secret

enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    # bcrypt("idp-password"),前缀改写为 $2a$ 以兼容所有 bcrypt 实现
    hash: $2a$10$SOTIWrkEUBR.3kBM8hAL8OcQhRNRn6Y/jUK3.NoAd/LkGcvV6nrmi
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd2001db215
