# 本地联调节点配置:内容即 install.sh 同目录 haproxy.cfg.snippet 的可运行版本
global
    log /dev/log format raw local0 info
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    mode http
    option httplog
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# dataplaneapi 的 API Basic Auth 凭据(WebUI 注册实例时填同一组)
userlist dataplaneapi
    user dataplaneapi insecure-password demosecret

# 一个演示前端,后端指向一个不存在的地址,便于观察 DOWN 状态
frontend demo_http
    bind *:8888
    # runtime map 演示:按 host 查表(dataplaneapi 依赖此引用注册 runtime map)
    http-request set-header X-Demo-Map %[req.hdr(host),map_str(/etc/haproxy/maps/hosts.map)]
    default_backend demo_app

backend demo_app
    balance roundrobin
    server s1 10.255.255.1:80 check inter 5s
    server s2 10.255.255.2:80 check inter 5s

listen stats
    bind *:8404
    stats enable
    stats uri /stats
